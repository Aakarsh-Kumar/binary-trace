[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compliance-review"
version = "0.1.0"
description = "Grounded, Local-First Skill-Retrieved Compliance Review"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "pymysql>=1.1,<1.2",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<1.14",
    "pydantic-settings>=2.5,<3",
    "ollama>=0.3,<0.4",
    "faiss-cpu>=1.8,<1.9",
    "sentence-transformers>=3.0,<4",
    "pymupdf>=1.24,<1.25",
    "python-docx>=1.1,<2",
    "markdown-it-py>=3.0,<4",
    "httpx>=0.27,<0.28",
    "typer>=0.12,<0.13",
    "structlog>=24.1,<25",
    "streamlit>=1.38,<1.40",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<1.12",
    "pytest>=8.3,<8.4",
    "pytest-cov>=5.0,<6",
    "pre-commit>=3.7,<4",
]

[project.scripts]
compliance-review = "compliance_review.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_review"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["UP017", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
